apiVersion: v1
kind: Namespace
metadata:
  name: unicore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unicore-webapi-config
  namespace: unicore
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  UseInMemoryDatabase: "false"
  Database__ApplyMigrationsOnStartup: "false"
  RedisCache__Enabled: "true"
  RedisCache__ConnectionString: "redis-master.redis.svc.cluster.local:6379"
  Jwt__Issuer: "UniCore"
  Jwt__Audience: "UniCore.Admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: unicore-webapi-secret
  namespace: unicore
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=postgres-rw.postgres.svc.cluster.local;Port=5432;Database=unicore_prod;Username=unicore_app;Password=change_me_db_password"
  Jwt__SigningKey: "change_me_signing_key_at_least_32_chars"
  Seed__AdminPassword: "change_me_admin_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicore-webapi
  namespace: unicore
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: unicore-webapi
  template:
    metadata:
      labels:
        app: unicore-webapi
    spec:
      containers:
        - name: webapi
          image: ghcr.io/jeja2023/unicore-webapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: unicore-webapi-config
            - secretRef:
                name: unicore-webapi-secret
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: unicore-webapi
  namespace: unicore
spec:
  selector:
    app: unicore-webapi
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
