name: backend-quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Ensure NuGet cache folder
        uses: ./.github/actions/ensure-nuget-cache-dir

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore UniCore.slnx

      - name: Build
        run: dotnet build UniCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Platform.WebApi.IntegrationTests/Platform.WebApi.IntegrationTests.csproj --configuration Release --collect:"XPlat Code Coverage"

      - name: Enforce coverage threshold
        shell: pwsh
        env:
          COVERAGE_THRESHOLD: "25"
        run: |
          $coverageFile = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if (-not $coverageFile) {
            throw "未找到 coverage.cobertura.xml"
          }
          [xml]$coverage = Get-Content $coverageFile.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $linePercent = [math]::Round($lineRate * 100, 2)
          $threshold = [double]($env:COVERAGE_THRESHOLD ?? "60")
          Write-Host "Line coverage: $linePercent%"
          if ($linePercent -lt $threshold) {
            throw "覆盖率低于阈值 $threshold%，当前 $linePercent%"
          }
