name: codeql

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            needs-manual-build: true
          - language: javascript-typescript
            build-mode: none
            needs-manual-build: false

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup .NET
        if: ${{ matrix.needs-manual-build }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore .NET solution
        if: ${{ matrix.needs-manual-build }}
        run: dotnet restore ./templates/unicore-platform-template/UniCorePlatformStarter.sln

      - name: Build .NET solution
        if: ${{ matrix.needs-manual-build }}
        run: dotnet build ./templates/unicore-platform-template/UniCorePlatformStarter.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
