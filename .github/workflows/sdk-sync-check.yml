name: sdk-sync-check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify-sdk-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: dotnet build UniCore.slnx --configuration Release

      - name: Install frontend dev dependencies
        working-directory: frontend/platform-admin
        run: npm ci

      - name: Start backend
        env:
          UseInMemoryDatabase: "true"
          Swagger__EnableInNonDevelopment: "true"
          Seed__AdminPassword: "Ci_Admin_12345!"
        run: dotnet run --project src/Platform.WebApi/Platform.WebApi.csproj --urls http://localhost:5000 &

      - name: Wait for swagger
        run: |
          for i in {1..40}; do
            if curl -sf http://localhost:5000/swagger/v1/swagger.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Swagger endpoint is unavailable."
          exit 1

      # Run before SDK check: npm scripts invoke `powershell`, which is not on Linux runners (use pwsh).
      # If the SDK step fails later, we still produced the contract JSON for the artifact upload.
      - name: Check frontend/backend module contracts
        working-directory: frontend/platform-admin
        env:
          UNICORE_BACKEND_BASE_URL: "http://localhost:5000"
          UNICORE_ADMIN_USERNAME: "admin"
          UNICORE_ADMIN_PASSWORD: "Ci_Admin_12345!"
          UNICORE_TENANT_ID: "default"
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/check-module-contract-alignment.ps1 -ProtocolVersion "1.0.0" -FailOnBreaking -OutputJson -JsonOutputPath ./artifacts/module-contract-alignment-report.json

      - name: Check generated SDK is up to date
        working-directory: frontend/platform-admin
        run: pwsh -File ./scripts/check-sdk-up-to-date.ps1

      - name: Upload module contract alignment report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-contract-alignment-report
          path: frontend/platform-admin/artifacts/module-contract-alignment-report.json
          if-no-files-found: warn

      - name: Publish module contract summary
        if: always()
        shell: pwsh
        run: |
          $reportPath = "frontend/platform-admin/artifacts/module-contract-alignment-report.json"
          if (-not (Test-Path -LiteralPath $reportPath)) {
            "## Module Contract Alignment" >> $env:GITHUB_STEP_SUMMARY
            "- Report file not found: $reportPath" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          "## Module Contract Alignment" >> $env:GITHUB_STEP_SUMMARY
          "- Checked at: $($report.checkedAt)" >> $env:GITHUB_STEP_SUMMARY
          "- Backend URL: $($report.backendBaseUrl)" >> $env:GITHUB_STEP_SUMMARY
          "- Frontend modules: $($report.frontendModuleCount)" >> $env:GITHUB_STEP_SUMMARY
          "- Backend modules: $($report.backendModuleCount)" >> $env:GITHUB_STEP_SUMMARY

          if ($report.passed) {
            "- Result: ✅ Passed" >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "- Result: ❌ Failed" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "### Errors" >> $env:GITHUB_STEP_SUMMARY
            foreach ($err in $report.errors) {
              "- $err" >> $env:GITHUB_STEP_SUMMARY
            }
          }
