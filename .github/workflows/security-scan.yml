name: security-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  secret-and-dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend workspace dependencies
        working-directory: frontend
        run: npm ci

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend dependency vulnerability check
        run: dotnet list src/Platform.WebApi/Platform.WebApi.csproj package --vulnerable --include-transitive

      - name: Frontend dependency vulnerability check
        working-directory: frontend
        run: npm audit --workspaces --audit-level=high
