name: Ensure NuGet cache directory
description: Create the default NuGet package cache directory on the current runner
runs:
  using: composite
  steps:
    - name: Ensure NuGet cache folder (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.nuget\packages" | Out-Null

    - name: Ensure NuGet cache folder (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: mkdir -p "$HOME/.nuget/packages"
